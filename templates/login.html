<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User Login - Roots & Rhythm</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    /* Custom Eco-Friendly Green Background matching design */
    .login-bg {
      background: radial-gradient(circle at 50% 10%, #ecfdf5 0%, #d1fae5 60%, #a7f3d0 100%);
      position: relative;
      overflow-x: hidden;
    }
    
    .landscape-skyline {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

    .auth-card-shadow {
      box-shadow: 0 20px 45px -10px rgba(5, 150, 105, 0.12), 0 10px 20px -5px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body class="login-bg min-h-screen flex flex-col justify-between antialiased selection:bg-emerald-600 selection:text-white relative">

  <!-- SVG Eco Landscape Skyline Background (Rolling hills, trees, and buildings) -->
  <svg class="landscape-skyline" viewBox="0 0 1440 220" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Back Hill Wave -->
    <path d="M0 130C320 70 540 180 820 120C1100 60 1280 140 1440 110V220H0V130Z" fill="#a7f3d0" fill-opacity="0.45"/>
    
    <!-- Left Skyline City & Trees Silhouette -->
    <g fill="#6ee7b7" fill-opacity="0.6">
      <rect x="20" y="145" width="22" height="60" rx="3"/>
      <rect x="46" y="125" width="26" height="80" rx="3"/>
      <rect x="76" y="140" width="20" height="65" rx="3"/>
      <rect x="100" y="155" width="28" height="50" rx="3"/>
      <!-- Window cutouts -->
      <circle cx="59" cy="135" r="2.5" fill="#d1fae5"/>
      <circle cx="59" cy="145" r="2.5" fill="#d1fae5"/>
      <circle cx="59" cy="155" r="2.5" fill="#d1fae5"/>
      <circle cx="31" cy="155" r="2" fill="#d1fae5"/>
      <circle cx="31" cy="165" r="2" fill="#d1fae5"/>
      <!-- Left Trees -->
      <circle cx="140" cy="175" r="16" fill="#34d399" fill-opacity="0.8"/>
      <rect x="138" y="180" width="4" height="25" fill="#059669"/>
      <circle cx="165" cy="180" r="12" fill="#10b981" fill-opacity="0.75"/>
      <rect x="163" y="185" width="4" height="20" fill="#047857"/>
    </g>

    <!-- Right Skyline City & Trees Silhouette -->
    <g fill="#6ee7b7" fill-opacity="0.6">
      <!-- Right Trees -->
      <circle cx="1275" cy="178" r="14" fill="#10b981" fill-opacity="0.75"/>
      <rect x="1273" y="184" width="4" height="22" fill="#047857"/>
      <circle cx="1302" cy="172" r="17" fill="#34d399" fill-opacity="0.8"/>
      <rect x="1300" y="180" width="4" height="25" fill="#059669"/>
      <!-- Right Buildings -->
      <rect x="1330" y="145" width="22" height="60" rx="3"/>
      <rect x="1356" y="130" width="28" height="75" rx="3"/>
      <rect x="1388" y="150" width="22" height="55" rx="3"/>
      <circle cx="1370" cy="140" r="2.5" fill="#d1fae5"/>
      <circle cx="1370" cy="150" r="2.5" fill="#d1fae5"/>
      <circle cx="1370" cy="160" r="2.5" fill="#d1fae5"/>
    </g>

    <!-- Front Hill Wave -->
    <path d="M0 160C260 125 500 190 780 145C1060 100 1240 170 1440 140V220H0V160Z" fill="#6ee7b7" fill-opacity="0.4"/>
  </svg>

  <!-- Top Simple Navigation Brand -->
  <header class="py-4 px-6 z-20 relative">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-700 flex items-center justify-center text-white shadow-md shadow-emerald-600/20 group-hover:scale-105 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <span class="text-base font-extrabold text-emerald-950 tracking-tight">Roots & Rhythm</span>
      </a>

      <a href="/" class="text-xs font-bold text-emerald-800 hover:text-emerald-950 bg-white/70 hover:bg-white backdrop-blur-md px-3 py-1.5 rounded-full border border-emerald-200/80 shadow-xs transition flex items-center gap-1">
        <span>Demo Dashboard</span>
        <span>→</span>
      </a>
    </div>
  </header>

  <!-- Main Center Card Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 z-20 relative my-auto">
    <div class="max-w-[420px] w-full bg-white rounded-[32px] auth-card-shadow border border-emerald-100/70 p-7 sm:p-9 space-y-6">

      <!-- ==============================================
           1. USER LOGIN VIEW (EXACT MATCH TO REFERENCE)
      =============================================== -->
      <div id="login-container" class="{% if active_tab == 'register' %}hidden{% endif %} space-y-5">
        
        <!-- Header: —— User Login —— -->
        <div class="flex items-center justify-center gap-3">
          <span class="w-10 h-[2.5px] bg-emerald-600 rounded-full"></span>
          <h2 class="text-2xl font-black text-emerald-950 tracking-tight">User Login</h2>
          <span class="w-10 h-[2.5px] bg-emerald-600 rounded-full"></span>
        </div>

        <!-- Alert Notification Box -->
        <div id="login-alert" class="hidden p-3 rounded-2xl text-xs font-semibold flex items-center gap-2">
          <span id="login-alert-icon"></span>
          <span id="login-alert-text"></span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
          
          <!-- Email / Username Input with Mail Icon -->
          <div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
              </span>
              <input 
                type="text" 
                id="login-username" 
                required 
                placeholder="Email Address" 
                class="w-full text-xs font-semibold pl-11 pr-4 py-3 rounded-2xl border border-slate-200 outline-none text-slate-800 placeholder:text-slate-400 focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition"
              >
            </div>
          </div>

          <!-- Password Input with Lock Icon & Eye Visibility Toggle -->
          <div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center justify-center">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="login-password" 
                required 
                placeholder="Password" 
                class="w-full text-xs font-semibold pl-11 pr-11 py-3 rounded-2xl border border-slate-200 outline-none text-slate-800 placeholder:text-slate-400 focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition"
              >
              <!-- Eye Toggle Button -->
              <button 
                type="button" 
                id="toggle-login-pass-btn" 
                class="absolute right-3.5 text-slate-400 hover:text-slate-600 transition p-1" 
                title="Toggle password visibility"
              >
                <svg id="eye-icon-login" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="flex items-center justify-between text-xs pt-0.5">
            <label class="flex items-center gap-2 cursor-pointer text-slate-600 select-none">
              <input type="checkbox" id="login-remember" class="w-4 h-4 rounded-md border-slate-300 text-emerald-600 focus:ring-emerald-500 accent-emerald-600">
              <span class="font-medium text-slate-700">Remember me</span>
            </label>
            <a href="javascript:void(0)" onclick="alert('Demo notice: You can log in with any demo account or register a new one. Default password is password123')" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline">
              Forgot Password?
            </a>
          </div>

          <!-- Green Pill Action Button: [→ Login] -->
          <button 
            type="submit" 
            id="login-btn-submit" 
            class="w-full py-3.5 bg-gradient-to-r from-emerald-700 to-green-700 hover:from-emerald-600 hover:to-green-600 active:scale-[0.98] text-white font-black text-sm rounded-full shadow-lg shadow-emerald-700/25 transition flex items-center justify-center gap-2 mt-2"
          >
            <svg class="w-4 h-4 transform group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            <span id="login-btn-text">Login</span>
          </button>
        </form>

        <!-- Divider with OR -->
        <div class="relative flex items-center justify-center my-5">
          <div class="border-t border-slate-200 w-full"></div>
          <span class="bg-white px-3 text-[11px] font-extrabold text-slate-400 uppercase tracking-widest absolute">OR</span>
        </div>

        <!-- Don't have an account? Register Now Button Card -->
        <button 
          type="button" 
          id="show-register-btn" 
          class="w-full py-3 px-4 rounded-full border border-emerald-200/90 bg-emerald-50/60 hover:bg-emerald-100/70 active:scale-[0.98] transition flex items-center justify-center gap-1.5 text-xs text-slate-700"
        >
          <span>Don't have an account?</span>
          <span class="font-extrabold text-emerald-700">Register Now</span>
        </button>

        <!-- Quick Demo Accounts One-Click Strip -->
        <div class="pt-2 text-center">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">
            One-Click Demo Fill:
          </span>
          <div class="flex items-center justify-center gap-1.5 flex-wrap">
            <button type="button" class="demo-fill-chip px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-100 text-slate-700 text-[11px] font-bold transition" data-user="aarav">
              Aarav (Student)
            </button>
            <button type="button" class="demo-fill-chip px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-100 text-slate-700 text-[11px] font-bold transition" data-user="meera">
              Meera (Teacher)
            </button>
            <button type="button" class="demo-fill-chip px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-100 text-slate-700 text-[11px] font-bold transition" data-user="rajesh">
              Rajesh (Parent)
            </button>
            <button type="button" class="demo-fill-chip px-2.5 py-1 rounded-full bg-slate-100 hover:bg-emerald-100 text-slate-700 text-[11px] font-bold transition" data-user="arvind">
              Arvind (Admin)
            </button>
          </div>
        </div>

      </div>

      <!-- ==============================================
           2. REGISTER VIEW (MATCHING STYLE)
      =============================================== -->
      <div id="register-container" class="{% if active_tab != 'register' %}hidden{% endif %} space-y-4">
        
        <!-- Header: —— Register Now —— -->
        <div class="flex items-center justify-center gap-3">
          <span class="w-10 h-[2.5px] bg-emerald-600 rounded-full"></span>
          <h2 class="text-2xl font-black text-emerald-950 tracking-tight">Create Account</h2>
          <span class="w-10 h-[2.5px] bg-emerald-600 rounded-full"></span>
        </div>

        <!-- Alert Notification Box -->
        <div id="reg-alert" class="hidden p-3 rounded-2xl text-xs font-semibold flex items-center gap-2">
          <span id="reg-alert-icon"></span>
          <span id="reg-alert-text"></span>
        </div>

        <!-- Registration Form -->
        <form id="register-form" class="space-y-3">
          
          <!-- Full Name -->
          <div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              </span>
              <input type="text" id="reg-name" required placeholder="Full Name" class="w-full text-xs font-semibold pl-10 pr-3.5 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition">
            </div>
          </div>

          <!-- Username & Role -->
          <div class="grid grid-cols-2 gap-2">
            <div class="relative flex items-center">
              <span class="absolute left-3 text-slate-400 pointer-events-none text-xs font-bold">@</span>
              <input type="text" id="reg-username" required placeholder="Username" class="w-full text-xs font-semibold pl-7 pr-3 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition">
            </div>
            <div>
              <select id="reg-role" class="w-full text-xs font-semibold px-3 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 bg-white transition cursor-pointer">
                <option value="student" selected>Student</option>
                <option value="teacher">Teacher / Faculty</option>
                <option value="parent">Parent</option>
                <option value="admin">School Admin</option>
              </select>
            </div>
          </div>

          <!-- Email Address -->
          <div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
              </span>
              <input type="email" id="reg-email" required placeholder="Email Address" class="w-full text-xs font-semibold pl-10 pr-3.5 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition">
            </div>
          </div>

          <!-- Grade & Language Preference -->
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="reg-cohort" placeholder="Grade 10-A" value="Grade 10-A" class="w-full text-xs font-semibold px-3.5 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition">
            <select id="reg-lang" class="w-full text-xs font-semibold px-2.5 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 bg-white transition cursor-pointer">
              <option value="en" selected>English</option>
              <option value="hi">हिंदी (Hindi)</option>
              <option value="kn">ಕನ್ನಡ (Kannada)</option>
              <option value="ta">தமிழ் (Tamil)</option>
              <option value="te">తెలుగు (Telugu)</option>
            </select>
          </div>

          <!-- Password with Toggle -->
          <div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              </span>
              <input type="password" id="reg-password" required minlength="6" placeholder="Create Password (min. 6 chars)" class="w-full text-xs font-semibold pl-10 pr-10 py-2.5 rounded-2xl border border-slate-200 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 transition">
              <button type="button" id="toggle-reg-pass-btn" class="absolute right-3.5 text-slate-400 hover:text-slate-600 p-1">
                <svg id="eye-icon-reg" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              </button>
            </div>
          </div>

          <!-- Register Action Button -->
          <button 
            type="submit" 
            id="reg-btn-submit" 
            class="w-full py-3.5 bg-gradient-to-r from-emerald-700 to-green-700 hover:from-emerald-600 hover:to-green-600 active:scale-[0.98] text-white font-black text-sm rounded-full shadow-lg shadow-emerald-700/25 transition flex items-center justify-center gap-2 mt-2"
          >
            <span>Register & Begin</span>
            <span>→</span>
          </button>
        </form>

        <!-- Divider with OR -->
        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-slate-200 w-full"></div>
          <span class="bg-white px-3 text-[11px] font-extrabold text-slate-400 uppercase tracking-widest absolute">OR</span>
        </div>

        <!-- Back to Login Button -->
        <button 
          type="button" 
          id="show-login-btn" 
          class="w-full py-3 px-4 rounded-full border border-emerald-200/90 bg-emerald-50/60 hover:bg-emerald-100/70 active:scale-[0.98] transition flex items-center justify-center gap-1.5 text-xs text-slate-700"
        >
          <span>Already have an account?</span>
          <span class="font-extrabold text-emerald-700">Login Here</span>
        </button>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-emerald-900/70 z-20 relative font-medium">
    <span>Roots & Rhythm • Smart, Inclusive & Personalized Education</span>
  </footer>

  <script>
    // Toggle between Login & Register views
    const loginContainer = document.getElementById("login-container");
    const registerContainer = document.getElementById("register-container");
    const showRegisterBtn = document.getElementById("show-register-btn");
    const showLoginBtn = document.getElementById("show-login-btn");

    function setView(view) {
      if (view === "register") {
        loginContainer.classList.add("hidden");
        registerContainer.classList.remove("hidden");
      } else {
        registerContainer.classList.add("hidden");
        loginContainer.classList.remove("hidden");
      }
    }

    if (showRegisterBtn) showRegisterBtn.addEventListener("click", () => setView("register"));
    if (showLoginBtn) showLoginBtn.addEventListener("click", () => setView("login"));

    // Password visibility toggle helpers
    function setupPassToggle(btnId, inputId, iconId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (!btn || !input) return;
      btn.addEventListener("click", () => {
        const isPass = input.type === "password";
        input.type = isPass ? "text" : "password";
        btn.classList.toggle("text-emerald-600", isPass);
      });
    }
    setupPassToggle("toggle-login-pass-btn", "login-password", "eye-icon-login");
    setupPassToggle("toggle-reg-pass-btn", "reg-password", "eye-icon-reg");

    // Quick fill demo buttons
    document.querySelectorAll(".demo-fill-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const u = chip.dataset.user;
        document.getElementById("login-username").value = u;
        document.getElementById("login-password").value = "password123";
        showLoginAlert(`Loaded credentials for ${u}! Click 'Login' to proceed.`);
      });
    });

    function showLoginAlert(msg, isError = false) {
      const alertBox = document.getElementById("login-alert");
      const icon = document.getElementById("login-alert-icon");
      const text = document.getElementById("login-alert-text");
      alertBox.className = `p-3 rounded-2xl text-xs font-semibold flex items-center gap-2 ${isError ? 'bg-rose-50 text-rose-800 border border-rose-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}`;
      icon.textContent = isError ? '❌' : '✅';
      text.textContent = msg;
      alertBox.classList.remove("hidden");
    }

    function showRegAlert(msg, isError = false) {
      const alertBox = document.getElementById("reg-alert");
      const icon = document.getElementById("reg-alert-icon");
      const text = document.getElementById("reg-alert-text");
      alertBox.className = `p-3 rounded-2xl text-xs font-semibold flex items-center gap-2 ${isError ? 'bg-rose-50 text-rose-800 border border-rose-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}`;
      icon.textContent = isError ? '❌' : '✅';
      text.textContent = msg;
      alertBox.classList.remove("hidden");
    }

    // Handle Login Form Submit
    const loginForm = document.getElementById("login-form");
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn-submit");
      const txt = document.getElementById("login-btn-text");
      btn.disabled = true;
      txt.textContent = "Logging in...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("login-username").value,
            password: document.getElementById("login-password").value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          showLoginAlert(data.message || data.error || "Login failed", true);
        } else {
          showLoginAlert(data.message || "Login successful! Redirecting...", false);
          setTimeout(() => {
            window.location.href = data.redirect || "/welcome";
          }, 600);
        }
      } catch (err) {
        showLoginAlert("Network connection error", true);
      } finally {
        btn.disabled = false;
        txt.textContent = "Login";
      }
    });

    // Handle Register Form Submit
    const regForm = document.getElementById("register-form");
    regForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("reg-btn-submit");
      btn.disabled = true;
      btn.innerHTML = `<span>Creating account...</span>`;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("reg-name").value,
            username: document.getElementById("reg-username").value,
            email: document.getElementById("reg-email").value,
            password: document.getElementById("reg-password").value,
            role: document.getElementById("reg-role").value,
            grade_or_cohort: document.getElementById("reg-cohort").value,
            language_preference: document.getElementById("reg-lang").value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          showRegAlert(data.message || data.error || "Registration failed", true);
        } else {
          showRegAlert(data.message || "Account created! Redirecting...", false);
          setTimeout(() => {
            window.location.href = data.redirect || "/welcome";
          }, 700);
        }
      } catch (err) {
        showRegAlert("Network connection error", true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Register & Begin</span> <span>→</span>`;
      }
    });
  </script>
</body>
</html>
